<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Estoque</title>

    <link
    rel="stylesheet"
    href="../css/dashboard.css">

</head>

<body>

    <header class="topbar">

        <h1>
            Estoque
        </h1>

        <a href="dashboard.html">

            Voltar

        </a>

    </header>


    <main class="conteudo">


        <div class="card">

            <h2>
                Cadastro Produto
            </h2>


            <input
            type="text"
            id="nome"
            placeholder="Nome">


            <input
            type="number"
            id="valor"
            placeholder="Valor">


            <input
            type="text"
            id="categoria"
            placeholder="Categoria">


            <input
            type="number"
            id="quantidade"
            placeholder="Quantidade">


            <input
            type="text"
            id="imagem"
            placeholder="URL da imagem">


            <button id="btnSalvar">

                Salvar Produto

            </button>

        </div>


        <div class="card">

            <h2>
                Produtos
            </h2>

            <div id="listaProdutos">

            </div>

        </div>


    </main>

    <script
    type="module"
    src="../js/estoque.js">

    </script>

</body>
</html>
